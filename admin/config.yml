# =============================================================================
# SURF CREW Agadir — Decap CMS configuration
# Backend: git-gateway (works with Netlify Identity, no server needed)
#
# Rules to keep this file loading:
#   * Indent with SPACES, never Tab.
#   * Every key under a collection must start in the same column.
#   * "slug" must be a plain string (not a nested block).
# =============================================================================

backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "products"
    label: "Wetsuits for rent"
    label_singular: "Wetsuit"
    folder: "content/products"
    create: true
    delete: true
    slug: "{{fields.name}}"
    summary: "{{name}} — size {{size}} — {{price}} MAD ({{stock}})"
    fields:
      - { name: "name", label: "Wetsuit name", widget: "string", hint: "Example: Wetsuit 3/2mm Black" }
      - name: "size"
        label: "Size"
        widget: "select"
        options: ["S", "M", "L", "XL"]
        hint: "The filter buttons on the shop use exactly these four sizes."
      - name: "category"
        label: "Category"
        widget: "select"
        default: "Wetsuit"
        options: ["Wetsuit"]
        hint: "This shop rents wetsuits only."
      - { name: "thickness", label: "Thickness", widget: "string", hint: "Example: 3/2mm Summer or 5/4mm Semi-Dry" }
      - { name: "price", label: "Price (MAD per day)", widget: "number", value_type: "int", min: 0, step: 10 }
      - name: "stock"
        label: "Stock"
        widget: "select"
        default: "available"
        options:
          - { label: "Available", value: "available" }
          - { label: "Last one", value: "last" }
          - { label: "Out of stock", value: "out" }
        hint: "Out of stock keeps the card on the site but disables its WhatsApp button."
      - { name: "image", label: "Photo", widget: "image", hint: "Shoot the suit on a hanger in daylight. Keep photos under 300 KB." }
      - { name: "description", label: "Short description", widget: "text", hint: "One or two sentences shown under the photo." }
      - { name: "featured", label: "Featured at the top of the shop", widget: "boolean", default: false, required: false }
      - { name: "body", label: "Full details (optional)", widget: "markdown", required: false, hint: "Shown in the enlarged photo view." }
