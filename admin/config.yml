# =============================================================================
# SURF WETSUIT — Decap CMS configuration
# Backend: git-gateway (works with Netlify Identity, no server needed)
#
# Rules to keep this file loading:
#   * Indent with SPACES, never Tab.
#   * Every key under a collection must start in the same column.
#   * "slug" must be a plain string (not a nested block).
# =============================================================================

backend:
  name: git-gateway
  branch: main

# Where photos uploaded in the panel are stored, and the URL written into the
# Markdown file. Netlify publishes the repo root, so the paths are identical.
media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "products"
    label: "Wetsuits for sale"
    label_singular: "Wetsuit"
    folder: "content/products"
    create: true
    delete: true
    slug: "{{fields.name}}"
    summary: "{{name}} — size {{size}} — {{price}} MAD ({{stock}})"
    fields:
      - { name: "name", label: "Wetsuit name", widget: "string", hint: "Example: Wetsuit 3/2mm Black" }
      - name: "size"
        label: "Size"
        widget: "select"
        options: ["S", "M", "L", "XL"]
        hint: "The filter buttons on the shop use exactly these four sizes."
      - name: "category"
        label: "Category"
        widget: "select"
        default: "Wetsuit"
        options: ["Wetsuit"]
        hint: "We sell wetsuits only."
      - { name: "thickness", label: "Thickness", widget: "string", hint: "Example: 3/2mm Summer or 5/4mm Semi-Dry" }
      - { name: "price", label: "Price (MAD)", widget: "number", value_type: "int", min: 0, step: 10, hint: "The full selling price, not a rental price." }
      - name: "stock"
        label: "Stock"
        widget: "select"
        default: "available"
        options:
          - { label: "In stock", value: "available" }
          - { label: "Last one", value: "last" }
          - { label: "Sold out", value: "out" }
        hint: "Sold out keeps the card on the site but disables its Buy button."
      - { name: "image", label: "Photo 1", widget: "image", hint: "Main photo — the one shown on the shop card. Shoot the suit on a hanger in daylight. Keep photos under 300 KB." }
      - { name: "image2", label: "Photo 2 (optional)", widget: "image", required: false, hint: "Second photo of the same suit — a side view, a detail of the seams, or the label. The card then shows a 2 badge and the enlarged view lets the customer swipe between both photos." }
      - { name: "description", label: "Short description", widget: "text", hint: "One or two sentences shown under the photo. Say whether the suit is new or used." }
      - { name: "featured", label: "Featured at the top of the shop", widget: "boolean", default: false, required: false }
      - { name: "body", label: "Full details (optional)", widget: "markdown", required: false, hint: "Shown in the enlarged photo view. Good place for condition and sizing notes." }
